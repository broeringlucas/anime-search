services:
  anime-search:
    image: node:18-alpine
    container_name: anime-search
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    working_dir: /usr/src/app
    environment:
      - NODE_ENV=production
    command: ["sh", "-c", "npm install && npm start"]